name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias zvi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zvi123456 -keypass zvi123456 \
            -dname "CN=Zvi, OU=Blog, O=Zvi, L=SG, ST=SG, C=SG"

      - name: Inject signing config
        run: |
          mkdir -p app/keystore
          cp android.keystore app/keystore/

      - name: Compute SHA256 fingerprint
        id: fp
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias zvi -storepass zvi123456 \
            | grep -A1 "SHA256:" | tail -1 | tr -d ' ' | tr -d ':')
          echo "fingerprint=$FP" >> $GITHUB_OUTPUT
          echo "FP=$FP"
          # 生成 assetlinks.json（需部署到 https://blog.zvi.onl/.well-known/assetlinks.json）
          cat > assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "onl.zvi.blog.app",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          EOF
          echo "--- assetlinks.json ---"
          cat assetlinks.json

      - name: Grant gradle permission
        run: chmod +x gradlew || true

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blog-zvi-apk
          path: |
            app/build/outputs/apk/release/*.apk
            assetlinks.json
            android.keystore

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: APK 构建 #${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/*.apk
            assetlinks.json
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
